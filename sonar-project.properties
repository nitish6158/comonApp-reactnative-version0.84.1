sonar.projectKey=meetus-mobile
sonar.projectName=MeetUs Mobile App
sonar.projectVersion=0.0.2
sonar.host.url=http://localhost:9000

sonar.sourceEncoding=UTF-8
sonar.sources=src,App.tsx,index.js
sonar.tests=__tests__,src

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

sonar.exclusions=\
  **/node_modules/**,\
  **/android/**,\
  **/ios/**,\
  **/coverage/**,\
  **/libs/**,\
  **/modules/**,\
  **/scripts/**,\
  **/src/docs/**,\
  **/src/graphql/generated/**,\
  **/*.generated.*,\
  **/*.config.js,\
  **/*.setup.js,\
  **/*.d.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

sonar.coverage.exclusions=\
  App.tsx,\
  index.js,\
  src/types/**,\
  src/styles/**,\
  src/Constants/**,\
  src/navigation/**,\
  **/*Style*.ts,\
  **/*Styles*.ts,\
  **/styles.ts,\
  **/styles.js,\
  **/styles.tsx,\
  **/*.d.ts

sonar.cpd.exclusions=\
  **/*Style*.ts,\
  **/*Styles*.ts,\
  **/styles.ts,\
  **/styles.js,\
  **/styles.tsx,\
  src/graphql/*.ts

